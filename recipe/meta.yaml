{% set name = "sym" %}
{% set version = "0.3.7" %}


package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/sym-{{ version }}.tar.gz
  sha256: e46567eab524266403522e913679566fece87fe70ce7071bfabc1b719d65265e

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - python {{ python_min }}
  run:
    - numpy
    - python >={{ python_min }}
    - sympy

test:
  imports:
    - sym
    - sym.tests
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/bjodah/sym
  summary: Unified wrapper for symbolic manipulation libraries in Python.
  doc_url: https://pythonhosted.org/sym/
  license: BSD-2-Clause
  license_file: LICENSE

extra:
  recipe-maintainers:
    - ProfLeao
    - bjodah
